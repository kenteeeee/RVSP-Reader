<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RSVP Reader</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12161B">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RSVP Reader">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --bg:#12161B; --bg2:#181D24; --panel:#1D232B;
    --ink:#E9E6DF; --ink-dim:#8A9099;
    --rule:#2A313A; --accent:#4FB3A9; --accent-dim:#2F6F68; --warn:#D9A24B;
    font-family:'IBM Plex Sans',system-ui,sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]){
      --bg:#F3F1EC; --bg2:#EAE7DF; --panel:#FFFFFF;
      --ink:#1A1D22; --ink-dim:#6B7178; --rule:#DAD5C9; --accent:#2F6F68; --accent-dim:#4FB3A9;
    }
  }
  :root[data-theme="light"]{
    --bg:#F3F1EC; --bg2:#EAE7DF; --panel:#FFFFFF;
    --ink:#1A1D22; --ink-dim:#6B7178; --rule:#DAD5C9; --accent:#2F6F68; --accent-dim:#4FB3A9;
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{margin:0; background:var(--bg); color:var(--ink); min-height:100%;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    display:flex; flex-direction:column; align-items:center;}
  .wrap{width:100%; max-width:560px; padding:26px 20px 40px;}
  header{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:18px;}
  h1{font-size:17px; font-weight:600; margin:0;}
  .theme-toggle{background:none; border:1px solid var(--rule); color:var(--ink-dim);
    border-radius:20px; padding:5px 12px; font-size:12px; cursor:pointer; font-family:inherit;}

  /* --- upload --- */
  #uploadView{display:flex; flex-direction:column; gap:14px;}
  .dropzone{border:1.5px dashed var(--rule); border-radius:12px; padding:40px 20px;
    text-align:center; color:var(--ink-dim); font-size:14px; cursor:pointer; background:var(--panel);}
  .dropzone.drag{border-color:var(--accent); color:var(--accent);}
  .dropzone b{color:var(--ink); display:block; font-size:15px; margin-bottom:6px;}
  #fileInput{display:none;}
  .status{font-size:13px; color:var(--ink-dim); text-align:center;}
  .status .bar{height:3px; background:var(--rule); border-radius:2px; overflow:hidden; margin-top:10px;}
  .status .fill{height:100%; width:0%; background:var(--accent); transition:width .15s linear;}

  /* --- reader (riusato dal prototipo) --- */
  #readerView{display:none; flex-direction:column;}
  .stage{position:relative; background:var(--panel); border:1px solid var(--rule);
    border-radius:10px; height:220px; display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .guide-top{position:absolute; top:14px; left:50%; width:1px; height:10px; background:var(--accent-dim);}
  .guide-bot{position:absolute; bottom:14px; left:50%; width:1px; height:10px; background:var(--accent-dim);}
  .word{font-family:'IBM Plex Mono',monospace; font-size:36px; font-weight:600; white-space:nowrap; letter-spacing:.5px;}
  .word .orp{color:var(--accent);}
  .media-card{position:absolute; inset:0; background:var(--bg2); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:10px; padding:10px;}
  .media-card img{max-width:100%; max-height:75%; border-radius:6px; border:1px solid var(--rule); object-fit:contain;}
  .media-label{font-size:12px; color:var(--ink-dim);}
  .continue-btn{margin-top:2px; background:var(--accent); color:var(--bg); border:none;
    padding:9px 20px; border-radius:8px; font-size:14px; font-weight:600; font-family:inherit; cursor:pointer;}
  .trail{margin-top:12px; background:var(--panel); border:1px solid var(--rule); border-radius:10px;
    padding:12px 14px; height:78px; overflow:hidden; position:relative;}
  .trail-inner{font-size:14px; line-height:1.7; color:var(--ink-dim); word-wrap:break-word;}
  .trail-inner .current{color:var(--ink); font-weight:600;}
  .trail-fade{position:absolute; top:0; left:0; right:0; height:16px;
    background:linear-gradient(var(--panel), transparent); pointer-events:none;}
  .progress-row{margin-top:14px; display:flex; align-items:center; gap:10px;}
  .progress-track{flex:1; height:4px; background:var(--rule); border-radius:2px; overflow:hidden;}
  .progress-fill{height:100%; background:var(--accent); width:0%; transition:width .12s linear;}
  .progress-pct{font-size:11px; color:var(--ink-dim); min-width:70px; text-align:right; font-variant-numeric:tabular-nums;}
  .controls{margin-top:22px; display:flex; flex-direction:column; gap:16px;}
  .row{display:flex; align-items:center; gap:14px; justify-content:center;}
  .btn{background:var(--bg2); border:1px solid var(--rule); color:var(--ink); width:50px; height:50px;
    border-radius:50%; font-size:17px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-family:inherit;}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--bg); width:58px; height:58px; font-size:19px;}
  .speed-label{display:flex; justify-content:space-between; font-size:12px; color:var(--ink-dim); margin-bottom:6px;}
  input[type=range]{-webkit-appearance:none; width:100%; height:3px; background:var(--rule); border-radius:2px; outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:var(--accent); cursor:pointer; margin-top:-6.5px;}
  input[type=range]::-moz-range-thumb{width:16px; height:16px; border-radius:50%; background:var(--accent); border:none; cursor:pointer;}
  .new-file{margin-top:20px; background:none; border:1px solid var(--rule); color:var(--ink-dim);
    padding:8px 14px; border-radius:8px; font-size:12px; cursor:pointer; font-family:inherit; align-self:center;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>RSVP Reader</h1>
    <button class="theme-toggle" id="themeToggle">Tema</button>
  </header>

  <div id="uploadView">
    <div class="dropzone" id="dropzone">
      <b>Carica un documento</b>
      Tocca per scegliere un file PDF, o trascinalo qui
    </div>
    <input type="file" id="fileInput" accept="application/pdf">
    <div class="status" id="statusBox" style="display:none;">
      <span id="statusText">Analisi del documento…</span>
      <div class="bar"><div class="fill" id="statusFill"></div></div>
    </div>
  </div>

  <div id="readerView">
    <div class="stage" id="stage">
      <div class="guide-top"></div><div class="guide-bot"></div>
      <div class="word" id="word">Pronto</div>
    </div>
    <div class="trail" id="trail">
      <div class="trail-fade"></div>
      <div class="trail-inner" id="trailInner"></div>
    </div>
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" id="fill"></div></div>
      <div class="progress-pct" id="pct">Pag. 0/0</div>
    </div>
    <div class="controls">
      <div class="row">
        <button class="btn" id="restart" title="Ricomincia">⟲</button>
        <button class="btn primary" id="play" title="Play/Pausa">▶</button>
        <button class="btn" id="back" title="Indietro 10 parole">⟵</button>
      </div>
      <div>
        <div class="speed-label"><span>Velocità</span><span id="wpmLabel">320 wpm</span></div>
        <input type="range" id="wpm" min="120" max="700" step="10" value="320">
      </div>
    </div>
    <button class="new-file" id="newFile">Carica un altro documento</button>
  </div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const uploadView = document.getElementById('uploadView');
const readerView = document.getElementById('readerView');
const statusBox = document.getElementById('statusBox');
const statusText = document.getElementById('statusText');
const statusFill = document.getElementById('statusFill');

dropzone.onclick = () => fileInput.click();
['dragover','dragleave','drop'].forEach(evt=>{
  dropzone.addEventListener(evt, e=>{
    e.preventDefault();
    dropzone.classList.toggle('drag', evt==='dragover');
    if(evt==='drop' && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });
});
fileInput.onchange = () => { if(fileInput.files[0]) handleFile(fileInput.files[0]); };

async function handleFile(file){
  if(file.type !== 'application/pdf'){ alert('Per ora sono supportati solo i file PDF.'); return; }
  statusBox.style.display = 'block';
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data:buf}).promise;
  const steps = [];
  const totalPages = pdf.numPages;

  for(let p=1; p<=totalPages; p++){
    statusText.textContent = 'Elaborazione pagina ' + p + ' di ' + totalPages + '…';
    statusFill.style.width = Math.round((p-1)/totalPages*100) + '%';
    const page = await pdf.getPage(p);

    // rileva se la pagina contiene immagini incorporate
    const opList = await page.getOperatorList();
    const hasImage = opList.fnArray.some(fn =>
      fn === pdfjsLib.OPS.paintImageXObject || fn === pdfjsLib.OPS.paintJpegXObject);

    if(hasImage){
      // pagina con contenuto visivo: la rendiamo come snapshot e la mostriamo come "fermata"
      const viewport = page.getViewport({scale:1.6});
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width; canvas.height = viewport.height;
      await page.render({canvasContext:canvas.getContext('2d'), viewport}).promise;
      steps.push({type:'image', dataUrl:canvas.toDataURL('image/jpeg',0.85), label:'Pagina ' + p + ' — contiene immagini/diagrammi'});
    } else {
      const textContent = await page.getTextContent();
      const pageText = textContent.items.map(it=>it.str).join(' ');
      const words = pageText.split(/\s+/).filter(Boolean);
      words.forEach(w => steps.push({type:'word', text:w}));
    }
  }

  statusFill.style.width = '100%';
  statusText.textContent = 'Pronto';
  setTimeout(()=>{ uploadView.style.display='none'; readerView.style.display='flex'; startReader(steps, totalPages); }, 250);
}

// --- motore RSVP ---
let steps = [], idx = 0, playing = false, timer = null, pageCount = 1;
const wordEl = document.getElementById('word');
const stageEl = document.getElementById('stage');
const fillEl = document.getElementById('fill');
const pctEl = document.getElementById('pct');
const playBtn = document.getElementById('play');
const wpmInput = document.getElementById('wpm');
const wpmLabel = document.getElementById('wpmLabel');

const trailInner = document.getElementById('trailInner');
const trailBox = document.getElementById('trail');
const TRAIL_MAX = 60;

function startReader(parsedSteps, totalPages){
  steps = parsedSteps; idx = 0; playing = false; pageCount = totalPages;
  playBtn.textContent = '▶'; wordEl.style.transform=''; wordEl.textContent = 'Pronto';
  trailInner.textContent = '';
  updateProgress();
}

function rebuildTrail(){
  // ricostruisce il testo già letto guardando gli step prima di idx
  const words = [];
  for(let i=0; i<idx && words.length<TRAIL_MAX; i++){
    const s = steps[idx-1-i];
    if(!s) break;
    if(s.type==='word') words.unshift(s.text);
  }
  renderTrail(words);
}
function pushToTrail(word){
  const spans = trailInner.querySelectorAll('span');
  const words = Array.from(spans).map(s=>s.textContent);
  words.push(word);
  if(words.length > TRAIL_MAX) words.shift();
  renderTrail(words);
}
function renderTrail(words){
  trailInner.innerHTML = words.map((w,i)=> i===words.length-1 ? '<span class="current">'+w+'</span>' : '<span>'+w+'</span>').join(' ');
  trailBox.scrollTop = trailBox.scrollHeight;
}

function orpIndex(word){
  const len = word.length;
  if(len<=1) return 0; if(len<=5) return 1; if(len<=9) return 2; return 3;
}
function renderWord(step){
  const w = step.text;
  const i = Math.min(orpIndex(w), Math.max(w.length-1,0));
  wordEl.innerHTML = w.slice(0,i) + '<span class="orp">'+ (w[i]||'') +'</span>' + w.slice(i+1);
  requestAnimationFrame(()=>{
    const full = wordEl.getBoundingClientRect();
    const orpSpan = wordEl.querySelector('.orp');
    if(!orpSpan) return;
    const os = orpSpan.getBoundingClientRect();
    const offset = (os.left + os.width/2) - (full.left + full.width/2);
    wordEl.style.transform = 'translateX(' + (-offset) + 'px)';
  });
}
function showMedia(step){
  clearMedia();
  const card = document.createElement('div');
  card.className = 'media-card'; card.id = 'mediaCard';
  card.innerHTML = '<img src="'+step.dataUrl+'"><div class="media-label">'+step.label+'</div><button class="continue-btn" id="continueBtn">Continua</button>';
  stageEl.appendChild(card);
  document.getElementById('continueBtn').onclick = ()=>{ clearMedia(); idx++; playing=true; playBtn.textContent='❚❚'; tick(); };
}
function clearMedia(){ const c=document.getElementById('mediaCard'); if(c) c.remove(); }

function updateProgress(){
  const pct = steps.length ? Math.round((idx/steps.length)*100) : 0;
  fillEl.style.width = pct+'%';
  pctEl.textContent = pct+'%';
}
function tick(){
  clearTimeout(timer);
  if(!playing) return;
  if(idx >= steps.length){ playing=false; playBtn.textContent='▶'; wordEl.style.transform=''; wordEl.textContent='Fine ✓'; return; }
  const step = steps[idx];
  updateProgress();
  if(step.type==='word'){
    renderWord(step);
    pushToTrail(step.text);
    const ms = 60000/parseInt(wpmInput.value,10);
    idx++;
    timer = setTimeout(tick, ms);
  } else {
    playing = false; playBtn.textContent='▶';
    showMedia(step);
  }
}
playBtn.onclick = ()=>{
  playing = !playing; playBtn.textContent = playing ? '❚❚' : '▶';
  if(playing) tick(); else clearTimeout(timer);
};
document.getElementById('restart').onclick = ()=>{
  idx=0; playing=false; clearTimeout(timer); clearMedia();
  playBtn.textContent='▶'; wordEl.style.transform=''; wordEl.textContent='Pronto';
  trailInner.textContent=''; updateProgress();
};
document.getElementById('back').onclick = ()=>{
  idx = Math.max(0, idx-10); clearMedia(); rebuildTrail(); updateProgress();
  if(playing) tick();
};
wpmInput.oninput = ()=>{ wpmLabel.textContent = wpmInput.value+' wpm'; };
document.getElementById('newFile').onclick = ()=>{
  clearTimeout(timer); playing=false; clearMedia();
  readerView.style.display='none'; uploadView.style.display='flex';
  statusBox.style.display='none'; fileInput.value='';
};
document.getElementById('themeToggle').onclick = ()=>{
  const root = document.documentElement;
  root.setAttribute('data-theme', root.getAttribute('data-theme')==='light' ? 'dark' : 'light');
};

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>
</body>
</html>
