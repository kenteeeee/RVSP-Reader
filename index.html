<title>RSVP Reader</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B0B0B">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=3">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --bg:#0B0B0B; --bg2:#161616; --panel:#1C1C1C; --panel2:#232323;
    --ink:#F2EFE9; --ink-dim:#8C8880;
    --rule:#2B2B2B; --accent:#F2B705; --accent-ink:#0B0B0B;
    font-family:'IBM Plex Sans',system-ui,sans-serif;
  }
  :root[data-theme="light"]{
    --bg:#F5F3EE; --bg2:#EBE8E0; --panel:#FFFFFF; --panel2:#F0EEE8;
    --ink:#17150F; --ink-dim:#6E6A60; --rule:#DEDACF; --accent:#B9860A; --accent-ink:#FFFFFF;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{margin:0; background:var(--bg); color:var(--ink); overflow:hidden;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
  button{font-family:inherit;}
  .view{display:none; height:100%; flex-direction:column;}
  .view.active{display:flex;}

  /* ---------- LIBRARY ---------- */
  #libraryView{padding:18px 18px 0;}
  .lib-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .brand{display:flex; align-items:center; gap:9px;}
  .brand .dot{width:11px; height:11px; border-radius:50%; background:var(--accent);}
  .brand h1{font-size:17px; margin:0; font-weight:700; letter-spacing:.2px;}
  .icon-btn{background:var(--panel); border:1px solid var(--rule); color:var(--ink); width:40px; height:40px;
    border-radius:11px; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .icon-btn.accent{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .icon-btn svg{width:19px; height:19px;}

  .lib-list{overflow-y:auto; flex:1; padding-bottom:96px; display:flex; flex-direction:column; gap:10px;}
  .doc-row{background:var(--panel); border:1px solid var(--rule); border-radius:14px; padding:12px;
    display:flex; align-items:center; gap:12px; cursor:pointer;}
  .doc-row:active{background:var(--panel2);}
  .doc-row .thumb{width:44px; height:56px; flex:0 0 auto; border-radius:8px; background:var(--bg2);
    display:flex; align-items:center; justify-content:center; color:var(--accent);}
  .doc-row .thumb svg{width:24px; height:24px;}
  .doc-info{flex:1; min-width:0; display:flex; flex-direction:column; gap:4px;}
  .doc-name{font-size:14.5px; font-weight:600; line-height:1.3; overflow:hidden; word-break:break-word;
    display:-webkit-box; -webkit-line-clamp:2; line-clamp:2; -webkit-box-orient:vertical;}
  .doc-meta{font-size:12px; color:var(--ink-dim); display:flex; flex-wrap:wrap; gap:2px 0;}
  .doc-meta span:not(:last-child)::after{content:"·"; margin:0 7px; opacity:.6;}
  .doc-progress{height:3px; background:var(--rule); border-radius:2px; overflow:hidden; margin-top:4px;}
  .doc-progress .fill{height:100%; background:var(--accent);}
  .doc-del{flex:0 0 auto; width:38px; height:38px; border-radius:10px; background:transparent;
    border:1px solid var(--rule); color:var(--ink-dim); display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .doc-del svg{width:17px; height:17px;}

  .empty-state{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--ink-dim); text-align:center; gap:10px; padding-bottom:40px;}
  .empty-state svg{width:40px; height:40px; opacity:.5;}

  .upload-fab{position:fixed; right:20px; bottom:calc(20px + env(safe-area-inset-bottom,0px));
    width:56px; height:56px; border-radius:50%; background:var(--accent); color:var(--accent-ink);
    border:none; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 18px rgba(0,0,0,.35); cursor:pointer;}
  .upload-fab svg{width:24px; height:24px;}
  #fileInput{display:none;}

  .upload-overlay{position:fixed; inset:0; background:rgba(0,0,0,.65); display:none; align-items:center; justify-content:center; z-index:40; padding:20px;}
  .upload-overlay.active{display:flex;}
  .upload-box{background:var(--panel); border:1px solid var(--rule); border-radius:16px; padding:28px 20px; width:100%; max-width:360px; text-align:center;}
  .upload-box b{display:block; font-size:15px; margin-bottom:6px;}
  .upload-box p{font-size:13px; color:var(--ink-dim); margin:0 0 16px;}
  .status-bar{height:4px; background:var(--rule); border-radius:2px; overflow:hidden; margin-top:14px;}
  .status-bar .fill{height:100%; width:0%; background:var(--accent); transition:width .15s linear;}
  .status-txt{font-size:12px; color:var(--ink-dim); margin-top:8px;}
  .ocr-cancel{display:none; margin-top:16px; background:transparent; border:1px solid var(--rule); color:var(--ink);
    padding:9px 22px; border-radius:20px; font-size:13px; cursor:pointer;}
  .ocr-cancel:disabled{opacity:.5; cursor:default;}

  /* ---------- READER ---------- */
  #readerView{position:relative;}
  .r-topbar{display:flex; align-items:center; justify-content:space-between; padding:12px 14px; flex:0 0 auto;}
  .r-title{font-size:12.5px; color:var(--ink-dim); max-width:52vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  .stage{flex:3 1 0; min-height:0; position:relative; display:flex; align-items:center; justify-content:center;
    overflow:hidden; padding:0 16px;}
  .guide-top{position:absolute; top:10%; left:50%; width:2px; height:14px; background:var(--accent); opacity:.55;}
  .guide-bot{position:absolute; bottom:10%; left:50%; width:2px; height:14px; background:var(--accent); opacity:.55;}
  .word{font-family:'IBM Plex Mono',monospace; font-weight:700; letter-spacing:.5px; white-space:nowrap;
    font-size:calc(clamp(30px, 9vw, 58px) * var(--word-scale, 1));}
  .word .orp{color:var(--accent);}

  .trail{flex:2 1 0; min-height:56px; margin:0 14px 10px; padding:12px 14px; overflow-y:auto;
    background:var(--panel); border:1px solid var(--rule); border-radius:14px;
    font-size:clamp(16px, 4.4vw, 20px); line-height:1.6; color:var(--ink); word-break:break-word;}
  .trail .t-word{opacity:.86; cursor:pointer; border-radius:4px; padding:0 1px;}
  .trail .t-word:active{background:var(--bg2);}
  .trail .t-word.current{color:var(--accent); font-weight:700; opacity:1;}
  .trail .t-prev{opacity:.5; margin-bottom:.55em; padding-bottom:.55em; border-bottom:1px dashed var(--rule);}
  .trail .t-prev .t-word{opacity:1;}
  .trail .t-img{display:inline-flex; align-items:center; justify-content:center; width:1.7em; height:1.15em;
    background:var(--accent); color:var(--accent-ink); border-radius:6px; vertical-align:middle; margin:0 2px; cursor:pointer;}
  .trail .t-img svg{width:62%; height:62%;}
  .trail .t-img.current{box-shadow:0 0 0 2px var(--ink);}
  .trail:empty::before{content:"La frase in lettura apparirà qui"; color:var(--ink-dim); font-size:13px;}

  .r-controls{flex:0 0 auto; padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));
    display:flex; flex-direction:column; gap:10px;}
  .r-row{display:flex; align-items:center; gap:12px; justify-content:center;}
  .btn{background:var(--panel); border:1px solid var(--rule); color:var(--ink); width:46px; height:46px;
    border-radius:50%; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); width:56px; height:56px; font-size:19px;}
  .speed-label{display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-dim); margin-bottom:5px;}
  input[type=range]{-webkit-appearance:none; width:100%; height:3px; background:var(--rule); border-radius:2px; outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:var(--accent); cursor:pointer; margin-top:-6.5px;}
  input[type=range]::-moz-range-thumb{width:16px; height:16px; border-radius:50%; background:var(--accent); border:none; cursor:pointer;}

  /* ---------- SEPARATORE regolabile (parola RSVP / storia di lettura) ---------- */
  .splitter{flex:0 0 auto; height:26px; margin:0 14px 2px; display:flex; align-items:center; gap:8px;}
  .split-grip{flex:1; height:26px; display:flex; align-items:center; justify-content:center; cursor:row-resize; touch-action:none;}
  .split-grip span{display:block; width:72px; height:5px; border-radius:3px; background:var(--ink-dim); opacity:.55; transition:background .15s, opacity .15s;}
  .splitter.dragging .split-grip span{background:var(--accent); opacity:1;}

  /* ---------- FULL IMMERSION: resta solo lo schermo di lettura ---------- */
  .imm-exit, .imm-hint{display:none;}
  #readerView.immersive{--word-scale:1.6;}
  #readerView.immersive .r-topbar, #readerView.immersive .splitter,
  #readerView.immersive .trail, #readerView.immersive .r-controls{display:none;}
  #readerView.immersive .stage{flex:1 1 auto; cursor:pointer;}
  #readerView.immersive .imm-exit{display:flex; position:absolute; top:10px; right:12px; z-index:20; width:40px; height:40px;
    align-items:center; justify-content:center; border-radius:50%; border:1px solid var(--rule); background:var(--panel);
    color:var(--ink); opacity:.3; cursor:pointer; padding:0;}
  #readerView.immersive .imm-exit:active{opacity:1;}
  #readerView.immersive .imm-exit svg{width:18px; height:18px;}
  #readerView.immersive .imm-hint{display:block; position:absolute; left:0; right:0; bottom:calc(22px + env(safe-area-inset-bottom,0px));
    text-align:center; font-size:12.5px; color:var(--ink-dim); pointer-events:none; opacity:0; transition:opacity .4s;}
  #readerView.immersive .imm-hint.show{opacity:.8;}

  /* ---------- MEDIA (immagini/formule) ---------- */
  .media-wrap{position:absolute; inset:0; background:var(--bg); display:flex; flex-direction:column; z-index:5;}
  .media-viewport{flex:1; overflow:hidden; position:relative; touch-action:none; display:flex; align-items:center; justify-content:center;}
  .media-viewport img{max-width:100%; max-height:100%; will-change:transform; user-select:none; -webkit-user-drag:none;}
  .media-footer{flex:0 0 auto; padding:14px 18px calc(16px + env(safe-area-inset-bottom,0px)); display:flex;
    flex-direction:column; align-items:center; gap:8px;}
  .media-label{font-size:12px; color:var(--ink-dim);}
  .continue-btn{background:var(--accent); color:var(--accent-ink); border:none; padding:12px 30px;
    border-radius:26px; font-size:15px; font-weight:700; cursor:pointer;}
  .zoom-hint{font-size:11px; color:var(--ink-dim); opacity:.7;}

  /* ---------- DRAWER PAGINE ---------- */
  .drawer-backdrop{position:fixed; inset:0; background:rgba(0,0,0,.5); opacity:0; pointer-events:none;
    transition:opacity .2s; z-index:20;}
  .drawer-backdrop.open{opacity:1; pointer-events:auto;}
  .drawer{position:fixed; top:0; right:0; bottom:0; width:min(78vw, 300px); background:var(--panel);
    border-left:1px solid var(--rule); transform:translateX(100%); transition:transform .22s ease; z-index:21;
    display:flex; flex-direction:column; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
  .drawer.open{transform:translateX(0);}
  .drawer-head{padding:16px; font-size:13px; font-weight:700; color:var(--ink-dim); border-bottom:1px solid var(--rule);}
  .drawer-list{flex:1; overflow-y:auto; padding:8px;}
  .drawer-item{padding:11px 12px; border-radius:10px; font-size:13.5px; color:var(--ink-dim); cursor:pointer; display:flex; align-items:center; gap:8px;}
  .drawer-item.current{background:var(--bg2); color:var(--ink); font-weight:700;}
  .drawer-item svg{width:14px; height:14px; flex:0 0 auto; opacity:.7;}
  .drawer-preview{margin:2px 8px 12px; padding:10px; background:var(--bg2); border-radius:12px;
    display:flex; flex-direction:column; align-items:center; gap:8px;}
  .drawer-preview img{max-width:100%; border-radius:8px; cursor:pointer;}
  .dp-loading{font-size:12px; color:var(--ink-dim); padding:16px 0;}
  .dp-go{background:var(--accent); color:var(--accent-ink); border:none; padding:9px 18px;
    border-radius:20px; font-size:12.5px; font-weight:700; cursor:pointer;}
</style>
</head>
<body>

<!-- ============ LIBRERIA ============ -->
<div class="view active" id="libraryView">
  <div class="lib-header">
    <div class="brand"><span class="dot"></span><h1>RSVP Reader</h1></div>
    <button class="icon-btn" id="themeToggle" title="Tema">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>
    </button>
  </div>
  <div class="lib-list" id="libGrid"></div>
</div>

<button class="upload-fab" id="uploadFab" title="Carica documento">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>
<input type="file" id="fileInput" accept=".pdf,.docx,.txt,.md,.markdown,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain">

<div class="upload-overlay" id="uploadOverlay">
  <div class="upload-box">
    <b id="uploadTitle">Elaborazione del documento</b>
    <p id="uploadSub">Sto analizzando le pagine…</p>
    <div class="status-bar"><div class="fill" id="statusFill"></div></div>
    <div class="status-txt" id="statusTxt"></div>
    <button class="ocr-cancel" id="ocrCancel">Interrompi</button>
  </div>
</div>

<!-- ============ READER ============ -->
<div class="view" id="readerView">
  <div class="r-topbar">
    <button class="icon-btn" id="backToLib" title="Libreria">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="r-title" id="readerTitle"></div>
    <button class="icon-btn" id="immersiveBtn" title="Modalità full immersion" aria-label="Full immersion">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <button class="icon-btn" id="drawerToggle" title="Pagine">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>
    </button>
  </div>

  <div class="stage" id="stage">
    <div class="guide-top"></div><div class="guide-bot"></div>
    <div class="word" id="word">Pronto</div>
  </div>

  <button class="imm-exit" id="immExit" title="Esci dalla full immersion" aria-label="Esci dalla full immersion">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <div class="imm-hint" id="immHint">Tocca per play/pausa</div>

  <div class="splitter" id="splitter">
    <div class="split-grip" id="splitGrip" role="separator" aria-orientation="horizontal" title="Trascina per regolare gli spazi (doppio tocco: ripristina)"><span></span></div>
  </div>

  <div class="trail" id="trail"></div>

  <div class="r-controls">
    <div>
      <div class="speed-label"><span>Velocità</span><span id="wpmLabel">320 wpm</span></div>
      <input type="range" id="wpm" min="120" max="700" step="10" value="320">
    </div>
    <div class="r-row">
      <button class="btn" id="restart" title="Ricomincia">⟲</button>
      <button class="btn primary" id="play" title="Play/Pausa">▶</button>
      <button class="btn" id="back" title="Indietro">⟵</button>
    </div>
  </div>
</div>

<div class="drawer-backdrop" id="drawerBackdrop"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">Pagine del documento</div>
  <div class="drawer-list" id="drawerList"></div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

/* ============================================================
   IndexedDB — libreria documenti (persistenza sul dispositivo)
   ============================================================ */
const DB_NAME = 'rsvpReaderDB', DB_VERSION = 2, STORE = 'documents', OCR_STORE = 'ocrPages';
function openDB(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = ()=>{
      const db = req.result;
      if(!db.objectStoreNames.contains(STORE)){
        db.createObjectStore(STORE, {keyPath:'id'});
      }
      if(!db.objectStoreNames.contains(OCR_STORE)){
        db.createObjectStore(OCR_STORE, {keyPath:'key'});   // risultati OCR, una voce per pagina: "idDocumento:pagina"
      }
    };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function dbPut(doc){
  const db = await openDB();
  return new Promise((res,rej)=>{
    const tx = db.transaction(STORE,'readwrite');
    tx.objectStore(STORE).put(doc);
    tx.oncomplete = ()=>res(); tx.onerror = ()=>rej(tx.error);
  });
}
async function dbGetAll(){
  const db = await openDB();
  return new Promise((res,rej)=>{
    const tx = db.transaction(STORE,'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = ()=>res(req.result || []); req.onerror = ()=>rej(req.error);
  });
}
async function dbGet(id){
  const db = await openDB();
  return new Promise((res,rej)=>{
    const tx = db.transaction(STORE,'readonly');
    const req = tx.objectStore(STORE).get(id);
    req.onsuccess = ()=>res(req.result || null); req.onerror = ()=>rej(req.error);
  });
}
async function dbDelete(id){
  const db = await openDB();
  return new Promise((res,rej)=>{
    const tx = db.transaction(STORE,'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = ()=>res(); tx.onerror = ()=>rej(tx.error);
  });
}

/* ---------- OCR: cache dei testi riconosciuti (per non rifare l'OCR a ogni apertura) ---------- */
async function ocrPut(docId, page, text){
  const db = await openDB();
  return new Promise((res,rej)=>{
    const tx = db.transaction(OCR_STORE,'readwrite');
    tx.objectStore(OCR_STORE).put({key: docId+':'+page, docId, page, text});
    tx.oncomplete = ()=>res(); tx.onerror = ()=>rej(tx.error);
  });
}
async function ocrGetAll(docId){
  const db = await openDB();
  return new Promise((res,rej)=>{
    const tx = db.transaction(OCR_STORE,'readonly');
    const req = tx.objectStore(OCR_STORE).getAll(IDBKeyRange.bound(docId+':', docId+';'));
    req.onsuccess = ()=>{ const m = new Map(); (req.result||[]).forEach(r=>m.set(r.page, r.text)); res(m); };
    req.onerror = ()=>rej(req.error);
  });
}
async function ocrDeleteDoc(docId){
  const db = await openDB();
  return new Promise((res,rej)=>{
    const tx = db.transaction(OCR_STORE,'readwrite');
    tx.objectStore(OCR_STORE).delete(IDBKeyRange.bound(docId+':', docId+';'));
    tx.oncomplete = ()=>res(); tx.onerror = ()=>rej(tx.error);
  });
}

/* ============================================================
   LIBRERIA — UI
   ============================================================ */
const libGrid = document.getElementById('libGrid');
const uploadFab = document.getElementById('uploadFab');
const fileInput = document.getElementById('fileInput');
const uploadOverlay = document.getElementById('uploadOverlay');
const statusFill = document.getElementById('statusFill');
const statusTxt = document.getElementById('statusTxt');

const docIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 3h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/></svg>';
const emptyIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M7 3h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/></svg>';

function formatSize(bytes){
  if(!bytes) return '';
  if(bytes < 1024*1024) return Math.max(1, Math.round(bytes/1024)) + ' KB';
  return (bytes/(1024*1024)).toFixed(1).replace('.', ',') + ' MB';
}

async function handleUpload(file){

  const ext = ((name.match(/\.([^.]+)$/)||[])[1] || '').toLowerCase();
  let type = null;
  if(ext==='pdf' || file.type==='application/pdf') type = 'pdf';
  else if(ext==='docx' || (file.type||'').includes('wordprocessingml')) type = 'docx';
  else if(['txt','md','markdown'].includes(ext) || file.type==='text/plain') type = 'txt';
  else if(ext==='doc'){
    alert('I file .doc (vecchio formato Word) non sono supportati: salvali come .docx da Word e ricaricali.');
    fileInput.value=''; return;
  } else {
    alert('Formato non supportato. Puoi caricare PDF, Word (.docx) e file di testo (.txt, .md).');
    fileInput.value=''; return;
  }

  document.getElementById('ocrCancel').style.display = 'none';
  document.getElementById('uploadTitle').textContent = 'Elaborazione del documento';
  statusFill.style.width = '5%'; statusTxt.textContent = '';
  try{
    const buf = await file.arrayBuffer();
    const doc = {
      id: Date.now(),
      name: name.replace(/\.[^.]+$/,''),
      addedAt: Date.now(),
      type,
      size: file.size,
      fileBlob: new Blob([buf], {type: file.type || 'application/octet-stream'}),
      lastIndex: 0,
      totalSteps: 0
    };
    if(type==='pdf'){
      const pdf = await pdfjsLib.getDocument({data:buf.slice(0)}).promise;
      statusFill.style.width = '15%';
      statusTxt.textContent = pdf.numPages + ' pagine rilevate';
      doc.pageCount = pdf.numPages;
    } else {
      statusTxt.textContent = 'Lettura del documento…';
      const flow = type==='docx' ? await parseDocx(doc.fileBlob) : parseTextFile(decodeText(buf));
      doc.pageCount = flow.page;

  }
}

/* ============================================================
   PARSING PDF -> steps (parola / immagine con numero di pagina)
   ============================================================ */
const OCR_FULLPAGE_COVERAGE = 0.6; // un'immagine che copre almeno questa quota della pagina = pagina "scansionata"
const OCR_MIN_TEXT_WORDS = 8;      // scansione con almeno queste parole di testo già incluso (PDF ricercabile): si legge quel testo
const OCR_MIN_RESULT_WORDS = 5;    // se l'OCR trova meno parole di così, la pagina resta una fermata immagine

// quota massima di pagina coperta da una singola immagine (segue le trasformazioni del PDF)
function pageImageCoverage(page, opList){
  const O = pdfjsLib.OPS;
  const v = page.view;
  const pageArea = Math.abs((v[2]-v[0])*(v[3]-v[1])) || 1;
  const imgOps = new Set([O.paintImageXObject, O.paintJpegXObject, O.paintInlineImageXObject,
                          O.paintImageMaskXObject, O.paintImageXObjectRepeat].filter(x=>x!==undefined));
  let det = 1, best = 0; const stack = [];
  for(let i=0; i<opList.fnArray.length; i++){
    const fn = opList.fnArray[i], a = opList.argsArray[i];
    if(fn===O.save) stack.push(det);
    else if(fn===O.restore){ if(stack.length) det = stack.pop(); }
    else if(fn===O.transform && a && a.length>=6) det *= (a[0]*a[3] - a[1]*a[2]);
    else if(fn===O.paintFormXObjectBegin){
      stack.push(det);
      const m = a && a[0];
      if(m && m.length>=6) det *= (m[0]*m[3] - m[1]*m[2]);
    }
    else if(fn===O.paintFormXObjectEnd){ if(stack.length) det = stack.pop(); }
    else if(imgOps.has(fn)) best = Math.max(best, Math.abs(det)/pageArea);
  }
  return best;
}

async function renderImageStep(page, p, label){
  const viewport = page.getViewport({scale:2});
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width; canvas.height = viewport.height;
  await page.render({canvasContext:canvas.getContext('2d'), viewport}).promise;
  return {type:'image', page:p, dataUrl:canvas.toDataURL('image/jpeg',0.85), label: label || ('Pagina '+p+' — immagini/diagrammi')};
}

// 1a fase: analizza le pagine e le classifica: 'text' | 'image' | 'scan' (immagine a tutta pagina senza testo: candidata all'OCR)
async function parsePdf(blob, onProgress){
  const buf = await blob.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data:buf}).promise;
  const pages = [];   // 1-based: pages[p] = {kind:'text', words} | {kind:'image', step} | {kind:'scan'}
  const total = pdf.numPages;
  for(let p=1; p<=total; p++){
    onProgress && onProgress(p, total);
    const page = await pdf.getPage(p);
    const opList = await page.getOperatorList();
    const hasImage = opList.fnArray.some(fn => fn===pdfjsLib.OPS.paintImageXObject || fn===pdfjsLib.OPS.paintJpegXObject);
    const fullPage = pageImageCoverage(page, opList) >= OCR_FULLPAGE_COVERAGE;
    const textContent = await page.getTextContent();
    const words = textContent.items.map(it=>it.str).join(' ').split(/\s+/).filter(Boolean);
    if(fullPage){
      pages[p] = words.length >= OCR_MIN_TEXT_WORDS ? {kind:'text', words} : {kind:'scan'};
    } else if(hasImage){
      pages[p] = {kind:'image', step: await renderImageStep(page, p)};
    } else {
      pages[p] = {kind:'text', words};
    }
  }
  return {pages, pageCount: total, pdfDoc: pdf};
}

// testo OCR -> parole (ricuce le sillabazioni a fine riga, scarta simboli isolati)
function ocrWords(text){
  return text
    .replace(/(\p{L})[-\u00AD]\s*\n\s*(\p{L})/gu, '$1$2')
    .split(/\s+/)
    .filter(w => /[\p{L}\p{N}]/u.test(w));
}

// 2a fase: costruisce la sequenza di "step" (parole / immagini) usando anche i testi OCR in cache
async function buildSteps(pages, ocrMap, pdf){
  const steps = [];
  for(let p=1; p<pages.length; p++){
    const pg = pages[p];
    if(pg.kind==='text'){
      pg.words.forEach(w=>steps.push({type:'word', page:p, text:w}));
    } else if(pg.kind==='image'){
      steps.push(pg.step);
    } else {
      const words = ocrMap.has(p) ? ocrWords(ocrMap.get(p)) : null;
      if(words && words.length >= OCR_MIN_RESULT_WORDS){
        words.forEach(w=>steps.push({type:'word', page:p, text:w}));
      } else {
        const page = await pdf.getPage(p);
        steps.push(await renderImageStep(page, p, 'Pagina '+p+' — pagina scansionata'));
      }
    }
  }
  return steps;
}

/* ---------- Word (.docx) e testo (.txt / .md) ---------- */
const TEXT_PAGE_WORDS = 350;   // lunghezza indicativa di una "sezione" quando il testo non ha titoli

function loadMammoth(){
  if(window.mammoth) return Promise.resolve();
  return new Promise((resolve, reject)=>{
    const sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js';
    sc.onload = resolve;
    sc.onerror = ()=>reject(new Error('Impossibile caricare il lettore Word: serve una connessione internet.'));
    document.head.appendChild(sc);
  });
}
function decodeText(buf){
  try{ return new TextDecoder('utf-8', {fatal:true}).decode(buf); }
  catch(e){ return new TextDecoder('windows-1252').decode(buf); }
}

// costruisce la sequenza di step (parole/immagini) divisa in "sezioni" (titoli, oppure blocchi di ~350 parole)
function makeFlow(){
  const f = {steps:[], labels:[], page:0, pageWords:0, buf:'', pendingTitle:null, lastTitle:null, needBreak:false};
  f.newPage = (title)=>{ f.page++; f.pageWords = 0; f.needBreak = false; f.labels[f.page] = title || ('Parte '+f.page); };
  f.ensurePage = ()=>{
    if(f.pendingTitle!==null){ f.lastTitle = f.pendingTitle; f.newPage(f.pendingTitle); f.pendingTitle = null; }
    else if(f.needBreak || !f.page){ f.newPage(f.lastTitle ? f.lastTitle+' (cont.)' : null); }
  };
  f.flush = ()=>{
    const words = f.buf.split(/\s+/).filter(Boolean); f.buf = '';
    for(const w of words){
      f.ensurePage();
      f.steps.push({type:'word', page:f.page, text:w});
      f.pageWords++;
      if(f.pageWords>=TEXT_PAGE_WORDS*2 || (f.pageWords>=TEXT_PAGE_WORDS && isSentenceEnd(w))) f.needBreak = true;
    }
  };
  f.image = (src, label)=>{ f.ensurePage(); f.steps.push({type:'image', page:f.page, dataUrl:src, label:label||'Immagine del documento'}); };
  return f;
}

const FLOW_BLOCKS = new Set(['p','div','li','ul','ol','table','thead','tbody','tr','td','th','blockquote','pre','section','article','h1','h2','h3','h4','h5','h6']);
function walkHtml(node, f){
  node.childNodes.forEach(ch=>{
    if(ch.nodeType===3){ f.buf += ch.nodeValue; return; }
    if(ch.nodeType!==1) return;
    const tag = ch.tagName.toLowerCase();
    if(tag==='script' || tag==='style') return;
    if(tag==='br'){ f.buf += ' '; return; }
    if(tag==='img'){
      f.flush();
      const src = ch.getAttribute('src') || '';
      if(src.length > 3000) f.image(src, 'Immagine del documento');   // scarta icone/puntini minuscoli
      return;
    }
    const block = FLOW_BLOCKS.has(tag);
    if(block) f.flush();
    if(tag==='h1' || tag==='h2' || tag==='h3'){
      const t = ch.textContent.replace(/\s+/g,' ').trim().slice(0,70);
      f.pendingTitle = t || null;
    }
    walkHtml(ch, f);
    if(block) f.flush();
  });
}
async function parseDocx(blob){
  await loadMammoth();
  const res = await mammoth.convertToHtml({arrayBuffer: await blob.arrayBuffer()});
  const dom = new DOMParser().parseFromString(res.value, 'text/html');
  const f = makeFlow();
  walkHtml(dom.body, f);
  f.flush();
  return f;
}
function parseTextFile(text){
  const f = makeFlow();
  text.split(/\r?\n/).forEach(line=>{
    const m = line.match(/^\s{0,3}#{1,3}\s+(.*\S)\s*$/);
    if(m){ f.flush(); f.pendingTitle = m[1].slice(0,70); f.buf += m[1]; f.flush(); return; }
    if(!line.trim()){ f.flush(); return; }
    f.buf += line + ' ';
  });
  f.flush();
  return f;
}

/* ---------- OCR (Tesseract.js, italiano + inglese) ---------- */
let ocrCancel = false;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve();
  return new Promise((resolve, reject)=>{
    const sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    sc.onload = resolve;
    sc.onerror = ()=>reject(new Error('Impossibile caricare il motore OCR: serve una connessione internet.'));
    document.head.appendChild(sc);
  });
}
async function runOcr(pdf, docId, pendingPages){
  ocrCancel = false;
  const cancelBtn = document.getElementById('ocrCancel');
  cancelBtn.disabled = false; cancelBtn.textContent = 'Interrompi'; cancelBtn.style.display = 'inline-block';
  cancelBtn.onclick = ()=>{ ocrCancel = true; cancelBtn.disabled = true; cancelBtn.textContent = 'Interruzione al termine della pagina…'; };
  document.getElementById('uploadTitle').textContent = 'Riconoscimento testo (OCR)';
  statusFill.style.width = '0%';
  statusTxt.textContent = 'Caricamento del motore OCR…';
  let worker = null, wakeLock = null, done = 0, curPct = 0, curPage = pendingPages[0];
  const total = pendingPages.length;
  const refresh = ()=>{
    statusFill.style.width = Math.round((done+curPct)/total*100)+'%';
    statusTxt.textContent = 'Pagina '+curPage+' · '+(done+1)+' di '+total+' · '+Math.round(curPct*100)+'%';
  };
  try{
    try{ if(navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); }catch(e){}
    await loadTesseract();
    worker = await Tesseract.createWorker(['ita','eng'], 1, {
      logger: m=>{ if(m.status==='recognizing text'){ curPct = m.progress||0; refresh(); } }
    });
    for(const p of pendingPages){
      if(ocrCancel) break;
      curPage = p; curPct = 0; refresh();
      const page = await pdf.getPage(p);
      const base = page.getViewport({scale:1});
      const scale = Math.max(1.5, Math.min(3.5, 2600/Math.max(base.width, base.height)));
      const viewport = page.getViewport({scale});
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width; canvas.height = viewport.height;
      await page.render({canvasContext:canvas.getContext('2d'), viewport}).promise;
      const {data} = await worker.recognize(canvas);
      canvas.width = 0; canvas.height = 0;
      await ocrPut(docId, p, data.text || '');
      done++; curPct = 0;
    }
  }catch(err){
    console.error(err);
    alert('OCR interrotto: '+(err && err.message ? err.message : err)+'\nLe pagine già riconosciute sono state salvate.');
  }finally{
    if(worker){ try{ await worker.terminate(); }catch(e){} }
    if(wakeLock){ try{ wakeLock.release(); }catch(e){} }
    cancelBtn.style.display = 'none';
  }
}

const libraryView = document.getElementById('libraryView');

const trailEl = document.getElementById('trail');

const drawerBackdrop = document.getElementById('drawerBackdrop');

let currentDoc = null, steps = [], idx = 0, playing = false, timer = null;

let pageIndexMap = []; // pageIndexMap[pageNum] = primo indice step di quella pagina
let pdfDocRef = null;          // riferimento al documento pdf.js aperto, per generare anteprime pagina su richiesta
let pageThumbCache = new Map(); // p -> dataURL, per non ri-renderizzare le anteprime già viste
let openPreviewPage = null;     // pagina la cui anteprima è aperta nel drawer, se presente

async function openDocument(id){
  const doc = await dbGet(id);

  currentDoc = doc;

  let pdfDoc = null;
  pageLabels = [];

  if(kind==='pdf'){

    const parsed = await parsePdf(doc.fileBlob, (p,total)=>{
      statusTxt.textContent = 'Pagina '+p+' di '+total;
      statusFill.style.width = Math.round(p/total*90)+'%';
    });
    pdfDoc = parsed.pdfDoc;
    const pages = parsed.pages;

    // pagine scansionate (solo immagine) non ancora passate all'OCR
    const pending = [];
    for(let p=1; p<pages.length; p++){ if(pages[p].kind==='scan' && !ocrMap.has(p)) pending.push(p); }
    if(pending.length && confirm(
      'Ci sono '+pending.length+(pending.length===1?' pagina scansionata':' pagine scansionate')+' senza testo (solo immagine).\n\n'
      + 'Vuoi eseguire l\'OCR (italiano + inglese) per leggerle in RSVP?\n\n'
      + 'Ci vogliono alcuni secondi per pagina e al primo utilizzo serve internet. Il risultato viene salvato sul dispositivo; '
      + 'puoi interrompere quando vuoi e riprendere più tardi. Se annulli, quelle pagine restano immagini da guardare.')){
      await runOcr(pdfDoc, doc.id, pending);
      ocrMap = await ocrGetAll(doc.id);
    }
    document.getElementById('uploadTitle').textContent = 'Apertura documento';
    statusTxt.textContent = 'Preparazione delle pagine…';
    steps = await buildSteps(pages, ocrMap, pdfDoc);
  } else {
    statusTxt.textContent = 'Lettura del documento…';
    statusFill.style.width = '40%';
    try{
      const flow = kind==='docx'
        ? await parseDocx(doc.fileBlob)
        : parseTextFile(decodeText(await doc.fileBlob.arrayBuffer()));
      steps = flow.steps; pageLabels = flow.labels; doc.pageCount = flow.page;
    }catch(err){
      console.error(err);
      uploadOverlay.classList.remove('active');
      alert('Non riesco ad aprire questo documento: '+(err && err.message ? err.message : err));
      switchView('library'); renderLibrary();
      return;
    }
  }

  pdfDocRef = pdfDoc;
  pageThumbCache = new Map();
  openPreviewPage = null;
  buildPageIndexMap();
  idx = resolveResumeIndex(doc);
  doc.totalSteps = steps.length;
  doc.lastIndex = idx;
  await dbPut(doc);
  statusFill.style.width='100%';
  setTimeout(()=>uploadOverlay.classList.remove('active'), 200);

  playing = false; playBtn.textContent='▶';
  trailEl.innerHTML=''; wordEl.style.transform=''; wordEl.style.fontSize=''; wordEl.textContent='Pronto';
  rebuildTrail();
  renderDrawerList();
  updateDrawerCurrent();
}

// riprende dalla pagina (e posizione nella pagina) salvate: resta corretto anche se l'OCR ha cambiato il numero di step
function resolveResumeIndex(doc){
  if(!steps.length) return 0;
  if(doc.lastPage){
    for(let p=doc.lastPage; p<=doc.pageCount; p++){
      const start = pageIndexMap[p];
      if(start===undefined) continue;
      if(p!==doc.lastPage) return start;
      let end = start; while(end<steps.length && steps[end].page===p) end++;
      return start + Math.min(doc.lastOffset||0, end-start-1);
    }
  }
  return Math.min(doc.lastIndex||0, steps.length-1);
}

function buildPageIndexMap(){
  pageIndexMap = [];
  steps.forEach((s,i)=>{ if(pageIndexMap[s.page]===undefined) pageIndexMap[s.page]=i; });
}

function switchView(name){
  libraryView.classList.toggle('active', name==='library');
  readerView.classList.toggle('active', name==='reader');
  uploadFab.style.display = name==='library' ? 'flex' : 'none';
}

document.getElementById('backToLib').onclick = async ()=>{
  exitImmersive();
  clearTimeout(timer); playing=false; clearMedia();
  pdfDocRef = null; pageThumbCache = new Map(); openPreviewPage = null;
  await saveProgress();
  closeDrawer();
  switchView('library');
  renderLibrary();
};
async function saveProgress(){
  if(!currentDoc) return;
  currentDoc.lastIndex = idx;
  currentDoc.totalSteps = steps.length;
  const cur = steps[Math.min(idx, steps.length-1)];
  if(cur){ currentDoc.lastPage = cur.page; currentDoc.lastOffset = idx - pageIndexMap[cur.page]; }
  await dbPut(currentDoc);
}

function orpIndex(word){
  const len = word.length;
  if(len<=1) return 0; if(len<=5) return 1; if(len<=9) return 2; return 3;
}
function renderWord(step){
  const w = step.text;
  const i = Math.min(orpIndex(w), Math.max(w.length-1,0));
  wordEl.style.fontSize = '';   // dimensione naturale (dipende dallo spazio assegnato alla parola)
  wordEl.innerHTML = esc(w.slice(0,i)) + '<span class="orp">'+esc(w[i]||'')+'</span>' + esc(w.slice(i+1));
  requestAnimationFrame(()=>{
    let full = wordEl.getBoundingClientRect();
    const avail = stage.clientWidth - 24;
    if(full.width > avail && full.width > 0){   // parola troppo lunga per la larghezza: rimpicciolisce solo questa
      wordEl.style.fontSize = (parseFloat(getComputedStyle(wordEl).fontSize) * avail/full.width) + 'px';
      full = wordEl.getBoundingClientRect();
    }
    const orpSpan = wordEl.querySelector('.orp'); if(!orpSpan) return;
    const os = orpSpan.getBoundingClientRect();
    const offset = (os.left+os.width/2) - (full.left+full.width/2);
    wordEl.style.transform = 'translateX('+(-offset)+'px)';
  });
}

/* @@trail-start */
const TRAIL_MAX_WORDS = 80;   // valvola di sicurezza per testi senza punti (es. slide a elenco)
const ABBREVIATIONS = new Set(['fig.','figg.','tab.','ecc.','etc.','es.','p.es.','cap.','pag.','pagg.','pp.','vs.','eq.','n.','sig.','dott.','prof.','ing.','cfr.','ss.','vol.','art.','dr.','mr.','mrs.']);
let prevItems = [], sentenceItems = [], sentenceDone = false; // ogni voce: {type:'word', text, i} oppure {type:'image', i, label}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function stripClosers(t){ return t.replace(/[)\]}"'»”’›]+$/,''); }

// vero se la parola chiude una frase (. ? ! …), escluse abbreviazioni, iniziali e numeri d'elenco
function isSentenceEnd(token){
  const t = stripClosers(token);
  const last = t.slice(-1);
  if(last==='?' || last==='!' || last==='…') return true;
  if(last!=='.') return false;
  if(ABBREVIATIONS.has(t.toLowerCase())) return false;
  if(/^\d+\.$/.test(t)) return false;
  if(/^([A-Za-z]\.)+$/.test(t)) return false;
  return true;
}

// Mini pause sulla punteggiatura: frazione dell'intervallo tra parole (quindi legata alla velocita'),
// con un tetto in millisecondi. Volutamente brevissime: servono solo a far percepire la punteggiatura.
const PUNCT_PAUSE = {
  ',': {factor:0.42, maxMs:120},
  ';': {factor:0.60, maxMs:165},
  ':': {factor:0.60, maxMs:165},
  '.': {factor:0.90, maxMs:240},
  '?': {factor:0.90, maxMs:240},
  '!': {factor:0.90, maxMs:240},
  '…': {factor:0.90, maxMs:240}
};
function punctuationPause(token, interval){
  const last = stripClosers(token).slice(-1);
  const p = PUNCT_PAUSE[last];
  if(!p) return 0;
  if(last==='.' && !isSentenceEnd(token)) return 0;
  return Math.min(p.maxMs, interval * p.factor);
}

function clearTrail(){ prevItems = []; sentenceItems = []; sentenceDone = false; renderTrail(); }

// raccoglie a ritroso una frase che finisce allo step "end" (incluso)
function collectBack(end){
  const items = [];
  let done = false, firstWordSeen = false, brokeAtEnd = false, i = end;
  for(; i>=0 && items.length<TRAIL_MAX_WORDS; i--){
    const st = steps[i];
    if(st.type==='image'){ items.unshift({type:'image', i, label:st.label}); continue; }
    const ends = isSentenceEnd(st.text);
    if(!firstWordSeen){ done = ends; firstWordSeen = true; }
    else if(ends){ brokeAtEnd = true; break; }
    items.unshift({type:'word', text:st.text, i});
  }
  return {items, done, next: brokeAtEnd ? i : -1};   // next = ultimo step della frase precedente
}

// ricostruisce il contesto prima dello step "idx": frase in corso + frase precedente
function rebuildTrail(){
  const cur = collectBack(idx-1);
  sentenceItems = cur.items; sentenceDone = cur.done;
  prevItems = cur.next>=0 ? collectBack(cur.next).items : [];
  renderTrail();
}

// aggiunge lo step appena raggiunto; quando parte una nuova frase, quella completata diventa "precedente"
function pushToTrail(step, i){
  if(sentenceDone){ prevItems = sentenceItems; sentenceItems = []; sentenceDone = false; }
  sentenceItems.push(step.type==='image' ? {type:'image', i, label:step.label} : {type:'word', text:step.text, i});
  if(sentenceItems.length>TRAIL_MAX_WORDS) sentenceItems.shift();
  if(step.type==='word' && isSentenceEnd(step.text)) sentenceDone = true;
  renderTrail();
}

const trailImgIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.4"/><path d="M21 16l-5.5-5.5L8 18"/></svg>';

function trailHtml(items, markCurrent){
  const n = items.length;
  return items.map((it,i)=>{
    const cur = (markCurrent && i===n-1) ? ' current' : '';
    if(it.type==='image'){
      return '<span class="t-img'+cur+'" data-i="'+it.i+'" title="Vai a questa immagine">'+trailImgIcon+'</span>';
    }
    return '<span class="t-word'+cur+'" data-i="'+it.i+'">'+esc(it.text)+'</span>';
  }).join(' ');
}
function renderTrail(){
  if(!prevItems.length && !sentenceItems.length){ trailEl.innerHTML = ''; return; }
  trailEl.innerHTML =
    (prevItems.length ? '<div class="t-prev">'+trailHtml(prevItems,false)+'</div>' : '')
    + '<div class="t-cur">'+trailHtml(sentenceItems,true)+'</div>';
  trailEl.scrollTop = trailEl.scrollHeight;
}
trailEl.addEventListener('click', e=>{
  const el = e.target.closest('[data-i]'); if(!el) return;
  jumpToIndex(Number(el.dataset.i));
});
/* @@trail-end */

function tick(){
  clearTimeout(timer);
  if(!playing) return;
  if(idx>=steps.length){ playing=false; playBtn.textContent='▶'; wordEl.style.transform=''; wordEl.textContent='Fine ✓'; saveProgress(); return; }
  const step = steps[idx];
  if(step.type==='word'){
    renderWord(step);
    pushToTrail(step, idx);
    updateDrawerCurrent();
    const interval = 60000/parseInt(wpmInput.value,10);
    const pause = punctuationPause(step.text, interval);
    idx++;
    if(idx % 25 === 0) saveProgress();
    timer = setTimeout(tick, interval + pause);
  } else {
    playing=false; playBtn.textContent='▶';
    pushToTrail(step, idx);
    updateDrawerCurrent();
    showMedia(step);
  }
}
function jumpToIndex(newIdx){
  if(newIdx<0 || newIdx>=steps.length) return;
  clearTimeout(timer); playing=false; playBtn.textContent='▶'; clearMedia();
  idx = newIdx;
  rebuildTrail();
  updateDrawerCurrent();
  const s = steps[idx];
  if(s && s.type==='word'){ wordEl.style.transform=''; renderWord(s); }
  else if(s && s.type==='image'){ showMedia(s); }
  saveProgress();
}
playBtn.onclick = ()=>{
  playing = !playing; playBtn.textContent = playing?'❚❚':'▶';
  if(playing) tick(); else { clearTimeout(timer); saveProgress(); }
};
document.getElementById('restart').onclick = ()=>{
  idx=0; playing=false; clearTimeout(timer); clearMedia();
  playBtn.textContent='▶'; wordEl.style.transform=''; wordEl.textContent='Pronto';
  clearTrail(); updateDrawerCurrent(); saveProgress();
};
document.getElementById('back').onclick = ()=>{
  idx = Math.max(0, idx-10); clearMedia(); rebuildTrail(); updateDrawerCurrent();
  if(playing) tick();
};
wpmInput.oninput = ()=>{ wpmLabel.textContent = wpmInput.value+' wpm'; };

/* ---------- media (immagini/formule) con zoom e pan ---------- */
function showMedia(step){
  clearMedia();
  const wrap = document.createElement('div');
  wrap.className = 'media-wrap'; wrap.id = 'mediaWrap';
  wrap.innerHTML =
    '<div class="media-viewport" id="mediaViewport"><img id="mediaImg" src="'+step.dataUrl+'"></div>'
    + '<div class="media-footer">'
    + '<div class="zoom-hint">Pizzica o doppio tocco per ingrandire</div>'
    + '<div class="media-label">'+step.label+'</div>'
    + '<button class="continue-btn" id="continueBtn">Continua</button>'
    + '</div>';
  stage.parentNode.insertBefore(wrap, trailEl);
  document.getElementById('continueBtn').onclick = ()=>{
    clearMedia(); idx++; playing=true; playBtn.textContent='❚❚'; tick();
  };
  setupZoom(document.getElementById('mediaViewport'), document.getElementById('mediaImg'));
}
function clearMedia(){ const m=document.getElementById('mediaWrap'); if(m) m.remove(); }

function setupZoom(viewport, img){
  let scale=1, tx=0, ty=0;
  let pointers = new Map();
  let startDist=0, startScale=1, lastTap=0;
  let panStart=null;

  function apply(){ img.style.transform = 'translate('+tx+'px,'+ty+'px) scale('+scale+')'; }
  function clamp(){
    scale = Math.min(Math.max(scale,1), 5);
    if(scale===1){ tx=0; ty=0; }
  }

  viewport.addEventListener('pointerdown', e=>{
    viewport.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pointers.size===1){ panStart = {x:e.clientX-tx, y:e.clientY-ty}; }
    if(pointers.size===2){
      const pts = Array.from(pointers.values());
      startDist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      startScale = scale;
    }
  });
  viewport.addEventListener('pointermove', e=>{
    if(!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pointers.size===2){
      const pts = Array.from(pointers.values());
      const dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      scale = startScale * (dist/startDist);
      clamp(); apply();
    } else if(pointers.size===1 && scale>1 && panStart){
      tx = e.clientX - panStart.x; ty = e.clientY - panStart.y;
      apply();
    }
  });
  function endPointer(e){
    pointers.delete(e.pointerId);
    if(pointers.size<2) startDist=0;
    if(pointers.size===0){
      const now = Date.now();
      if(now-lastTap<300){
        if(scale>1){ scale=1; tx=0; ty=0; } else { scale=2.4; }
        apply();
      }
      lastTap = now;
    }
  }
  viewport.addEventListener('pointerup', endPointer);
  viewport.addEventListener('pointercancel', endPointer);
  viewport.addEventListener('wheel', e=>{
    e.preventDefault();
    scale += (e.deltaY<0 ? 0.15 : -0.15);
    clamp(); apply();
  }, {passive:false});
  viewport.addEventListener('dblclick', ()=>{
    if(scale>1){ scale=1; tx=0; ty=0; } else { scale=2.4; }
    apply();
  });
}

/* ---------- drawer pagine ---------- */
document.getElementById('drawerToggle').onclick = ()=>{ drawer.classList.add('open'); drawerBackdrop.classList.add('open'); scrollDrawerToCurrent(); };
drawerBackdrop.onclick = closeDrawer;
function closeDrawer(){ drawer.classList.remove('open'); drawerBackdrop.classList.remove('open'); }

const imgIconSmall = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.3"/><path d="M21 16l-5.5-5.5L8 18"/></svg>';

function renderDrawerList(){
  const pages = [];
  for(let p=1; p<=(currentDoc?currentDoc.pageCount:0); p++){
    const isImg = steps[pageIndexMap[p]]?.type==='image';
    pages.push({p, isImg});
  }
  drawerList.innerHTML = pages.map(pg=>
    '<div class="drawer-item" data-page="'+pg.p+'">'+(pg.isImg?imgIconSmall:'')+'<span>'+esc((currentDoc && currentDoc.type && currentDoc.type!=='pdf') ? (pageLabels[pg.p] || ('Parte '+pg.p)) : ('Pagina '+pg.p))+'</span></div>'
  ).join('');
  openPreviewPage = null;
}

// genera (o recupera dalla cache) l'anteprima della pagina; riusa l'immagine già estratta se la pagina è di tipo "immagine"
async function getPageThumb(p){
  const atPage = steps[pageIndexMap[p]];
  if(atPage && atPage.type==='image') return atPage.dataUrl;
  if(pageThumbCache.has(p)) return pageThumbCache.get(p);
  if(!pdfDocRef) return '';
  const page = await pdfDocRef.getPage(p);
  const viewport = page.getViewport({scale:1.3});
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width; canvas.height = viewport.height;
  await page.render({canvasContext:canvas.getContext('2d'), viewport}).promise;
  const url = canvas.toDataURL('image/jpeg',0.85);
  pageThumbCache.set(p, url);
  return url;
}

// apre/chiude l'anteprima della pagina appena sotto la riga toccata, spingendo in basso le pagine successive
async function togglePagePreview(item, p){
  const existing = document.getElementById('drawerPreview');
  if(existing){
    const wasThisPage = Number(existing.dataset.page) === p;
    existing.remove();
    if(wasThisPage){ openPreviewPage = null; return; }
  }
  openPreviewPage = p;
  const box = document.createElement('div');
  box.className = 'drawer-preview'; box.id = 'drawerPreview'; box.dataset.page = String(p);
  box.innerHTML = '<div class="dp-loading">Caricamento anteprima…</div>';
  item.insertAdjacentElement('afterend', box);
  const thumb = await getPageThumb(p);
  if(openPreviewPage !== p) return; // nel frattempo è stata aperta un'altra pagina
  box.innerHTML = '<img src="'+thumb+'" alt="Anteprima pagina '+p+'" id="dpImg"><button class="dp-go" id="dpGo">Leggi da qui</button>';
  const goToPage = ()=>{ jumpToIndex(pageIndexMap[p] ?? idx); closeDrawer(); };
  document.getElementById('dpGo').onclick = goToPage;
  document.getElementById('dpImg').onclick = goToPage;
}
drawerList.addEventListener('click', e=>{
  const item = e.target.closest('.drawer-item'); if(!item) return;
  const p = Number(item.dataset.page);
  if(currentDoc && currentDoc.type && currentDoc.type!=='pdf'){   // Word/testo: niente anteprima, si salta direttamente alla sezione
    if(pageIndexMap[p]!==undefined){ jumpToIndex(pageIndexMap[p]); closeDrawer(); }
    return;
  }
  togglePagePreview(item, p);
});
function updateDrawerCurrent(){
  const s = steps[idx]; if(!s) return;
  const p = s.page;
  drawerList.querySelectorAll('.drawer-item').forEach(el=>{
    el.classList.toggle('current', Number(el.dataset.page)===p);
  });
}
function scrollDrawerToCurrent(){
  const cur = drawerList.querySelector('.drawer-item.current');
  if(cur) cur.scrollIntoView({block:'center'});
}

/* ---------- tema ---------- */
document.getElementById('themeToggle').onclick = ()=>{
  const root = document.documentElement;
  root.setAttribute('data-theme', root.getAttribute('data-theme')==='light' ? 'dark' : 'light');
};

/* ---------- separatore regolabile: parola RSVP / storia di lettura ---------- */
const SPLIT_KEY = 'rsvpSplitRatio', SPLIT_DEFAULT = 0.6, SPLIT_MIN = 0.2, SPLIT_MAX = 0.8;
let splitRatio = SPLIT_DEFAULT;
try{ const v = parseFloat(localStorage.getItem(SPLIT_KEY)); if(v>=SPLIT_MIN && v<=SPLIT_MAX) splitRatio = v; }catch(e){}
function applySplit(){
  stage.style.flexGrow = (splitRatio*100).toFixed(2);
  trailEl.style.flexGrow = ((1-splitRatio)*100).toFixed(2);
  // la parola cresce/si riduce insieme allo spazio che le viene dato (60% = dimensione originale)
  const scale = Math.min(1.35, Math.max(0.7, splitRatio/SPLIT_DEFAULT));
  document.documentElement.style.setProperty('--word-scale', scale.toFixed(3));
  refitWord();
}
function setSplit(r, save){
  splitRatio = Math.min(SPLIT_MAX, Math.max(SPLIT_MIN, r));
  applySplit();
  if(save){ try{ localStorage.setItem(SPLIT_KEY, String(splitRatio)); }catch(e){} }
}
(function(){
  const splitter = document.getElementById('splitter');
  const grip = document.getElementById('splitGrip');
  let drag = null;
  grip.addEventListener('pointerdown', e=>{
    grip.setPointerCapture(e.pointerId);
    drag = {top: stage.getBoundingClientRect().top, total: stage.offsetHeight + trailEl.offsetHeight};
    splitter.classList.add('dragging');
    e.preventDefault();
  });
  grip.addEventListener('pointermove', e=>{
    if(!drag) return;
    setSplit((e.clientY - drag.top - splitter.offsetHeight/2) / drag.total, false);
  });
  const end = ()=>{ if(!drag) return; drag = null; splitter.classList.remove('dragging'); setSplit(splitRatio, true); };
  grip.addEventListener('pointerup', end);
  grip.addEventListener('pointercancel', end);
  grip.addEventListener('dblclick', ()=>setSplit(SPLIT_DEFAULT, true));
})();
applySplit();

/* ---------- full immersion ---------- */
let immersive = false, immersiveFs = false, immHintTimer = null;
function refitWord(){
  const shown = steps[idx-1] || steps[idx];
  if(shown && shown.type==='word' && wordEl.textContent===shown.text) renderWord(shown);
}
function enterImmersive(){
  if(immersive) return;
  immersive = true;
  readerView.classList.add('immersive');
  closeDrawer();
  try{
    const el = document.documentElement;
    if(!document.fullscreenElement && el.requestFullscreen){
      el.requestFullscreen().then(()=>{ immersiveFs = true; }).catch(()=>{});
    }
  }catch(e){}
  const hint = document.getElementById('immHint');
  hint.classList.add('show');
  clearTimeout(immHintTimer);
  immHintTimer = setTimeout(()=>hint.classList.remove('show'), 2600);
  requestAnimationFrame(()=>requestAnimationFrame(refitWord));
}
function exitImmersive(){
  if(!immersive) return;
  immersive = false;
  readerView.classList.remove('immersive');
  clearTimeout(immHintTimer);
  if(immersiveFs && document.fullscreenElement && document.exitFullscreen){ try{ document.exitFullscreen(); }catch(e){} }
  immersiveFs = false;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ refitWord(); trailEl.scrollTop = trailEl.scrollHeight; }));
}
document.getElementById('immersiveBtn').onclick = enterImmersive;
document.getElementById('immExit').onclick = e=>{ e.stopPropagation(); exitImmersive(); };
stage.addEventListener('click', ()=>{
  if(immersive && !document.getElementById('mediaWrap')) playBtn.onclick();   // tocco = play/pausa
});
document.addEventListener('fullscreenchange', ()=>{
  if(!document.fullscreenElement && immersive && immersiveFs) exitImmersive();   // uscita dal pieno schermo con il gesto di sistema
});
document.addEventListener('keydown', e=>{
  if(!readerView.classList.contains('active')) return;
  if(e.key==='Escape' && immersive){ exitImmersive(); return; }
  if(!immersive) return;
  if(e.key===' '){ e.preventDefault(); if(!document.getElementById('mediaWrap')) playBtn.onclick(); }
  else if(e.key==='ArrowUp' || e.key==='ArrowDown'){
    e.preventDefault();
    wpmInput.value = Math.min(700, Math.max(120, parseInt(wpmInput.value,10) + (e.key==='ArrowUp' ? 10 : -10)));
    wpmInput.oninput();
  }
});

/* ---------- avvio ---------- */
renderLibrary();
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('service-worker.js').catch(()=>{}); });
}
